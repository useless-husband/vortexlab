name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: build
        run: cargo build --release
      - name: tests (unit, solver, codecs, small-grid validation against the published numbers)
        run: cargo test --release
      - name: quick validation set and report
        run: |
          ./target/release/vortexlab validate --quick --threads 2 --out results/quick
          ./target/release/vortexlab bench --n 20 --steps 500 --threads-list 1,2 --out results/quick
          ./target/release/vortexlab report --results results/quick --out results/quick/report
      - name: demo and a user-supplied shape
        run: |
          ./target/release/vortexlab demo --threads 2 --out results/demo
          ./target/release/vortexlab shape "我的形狀/機翼.png" --cells 60 --units 30 --threads 2 --out results/shape
          test -s results/demo/vorticity.gif && test -s results/shape/wake.png
      - uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: |
            results/quick
            results/demo
            results/shape
